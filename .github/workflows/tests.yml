name: tests

on:
  push:
    branches: [main, build]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: unit tests
        run: python3 -m unittest discover -s tests -t .
      - name: personal-data scan
        run: python3 scripts/scan_personal.py --all
