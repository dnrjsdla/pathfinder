[project]
name = "pathfinder"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pathfinder = "pathfinder.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pathfinder*"]

[tool.setuptools.package-data]
pathfinder = ["prompts/*.txt"]
